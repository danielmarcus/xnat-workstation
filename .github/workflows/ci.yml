name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (layering boundaries)
        run: npm run lint

      # `npm run build` does NOT typecheck the renderer — build:renderer is `vite build`,
      # and esbuild strips types without checking them. Only build:main ran tsc, so
      # renderer + e2e type errors accumulated unseen (57 and 251 respectively, cleared
      # 2026-09-14). This step is what keeps them at zero.
      - name: Typecheck (renderer + main + e2e)
        run: npm run typecheck

      - name: Install DICOM validator
        run: |
          sudo apt-get update
          sudo apt-get install -y dicom3tools

      - name: Run test suite
        env:
          DCIODVFY_BIN: /usr/bin/dciodvfy
        run: npm test

      - name: Build application
        run: npm run build
