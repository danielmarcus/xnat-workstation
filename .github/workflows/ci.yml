name: CI

# Tiered checks (CLAUDE.md, "Testing: what to run when"):
#
#   selective — pull requests and codex/** pushes: only what the change can affect, decided by
#               the "Classify changes" step (scripts/change-areas.mjs) from the changed files. A docs-only change runs
#               nothing past that step (the job still reports, so a required check never hangs).
#   full      — pushes to main, manual runs, and any change to dependencies, the test setup or
#               the workflows: every check, as before. On main this is the post-merge safety net
#               for anything the selective tier missed.
#
# Releases are gated separately, in release.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The whole history, so the changed files can be found against the base.
          fetch-depth: 0

      # The patterns live in scripts/change-areas.mjs, shared with `npm run test:changed`.
      # Plain Node, no dependencies: it runs before setup-node / npm ci (the runner has Node).
      - name: Classify changes
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/change-areas.mjs ci ${PR_BASE:+--base "$PR_BASE"}

      - name: Set up Node.js
        if: steps.plan.outputs.mode != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.plan.outputs.mode != 'skip'
        run: npm ci

      - name: Lint (layering boundaries)
        if: steps.plan.outputs.mode != 'skip'
        run: npm run lint

      # THIRD-PARTY-NOTICES.txt must list every shipped dependency's licence: after a
      # dependency change, run `npm run notices` and commit the result.
      - name: Third-party notices up to date
        if: steps.plan.outputs.mode == 'full'
        run: npm run notices:check

      # `npm run build` does NOT typecheck the renderer — build:renderer is `vite build`,
      # and esbuild strips types without checking them. Only build:main ran tsc, so
      # renderer + e2e type errors accumulated unseen (57 and 251 respectively, cleared
      # 2026-09-14). This step is what keeps them at zero.
      - name: Typecheck (renderer + main + e2e)
        if: steps.plan.outputs.mode != 'skip'
        run: npm run typecheck

      - name: Install DICOM validator
        if: steps.plan.outputs.dicom == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dicom3tools

      - name: Run test suite
        if: steps.plan.outputs.mode == 'full'
        env:
          DCIODVFY_BIN: /usr/bin/dciodvfy
        run: npm test

      # CI is cleared so the external-validator test skips (rather than fails) without
      # dciodvfy; the DICOM step below runs it, with the validator, whenever DICOM code changes.
      - name: Run related unit tests
        if: steps.plan.outputs.mode == 'selective' && steps.plan.outputs.related != ''
        env:
          CI: ''
          RELATED: ${{ steps.plan.outputs.related }}
        run: npx vitest related --run --passWithNoTests $RELATED

      - name: DICOM compliance suites
        if: steps.plan.outputs.mode == 'selective' && steps.plan.outputs.dicom == 'true'
        env:
          DCIODVFY_BIN: /usr/bin/dciodvfy
        run: npm run test:dicom:compliance

      - name: Build application
        if: steps.plan.outputs.build == 'true'
        run: npm run build
